# Arc 21 — continuous integration.
#
# The specification's rule is the whole point of this file: "A pull request must
# not pass with TypeScript errors or failing engine tests."
#
# WHAT HAS ACTUALLY BEEN RUN. There is no remote and no CI runner has ever
# executed this workflow, so every step below was instead run locally, in this
# order, and its output pasted into the session report. A workflow whose steps
# have never been run is a wish. What has NOT been exercised is the runner
# plumbing itself — `actions/checkout`, `actions/setup-node` and
# `supabase/setup-cli` — because that cannot exist on this machine.
#
# TWO JOBS, AND WHY THE SPLIT MATTERS. `tests/server/**` talks to real Edge
# Functions over HTTP and SKIPS when no stack is reachable. A skip is not a
# pass. So `checks` explicitly EXCLUDES that directory rather than running it
# and quietly skipping it, and `database` runs it with
# ARC21_REQUIRE_SERVER_STACK=1, which turns the skip into a hard failure. A
# database job whose stack failed to come up therefore reports a broken stack
# instead of a green suite that tested nothing. The two together run every test
# in the repository exactly once: 1,564 + 100 = 1,664.
#
# Both steps call the npm script rather than repeating its command, so the
# workflow cannot drift from what a local run does — including the
# `--maxWorkers=2` the server half needs to stop being load-dependent.
#
# Node is pinned to the version every local run was validated on. package.json
# `engines` permits >=22, but only 26 has been exercised here, and claiming
# otherwise is the kind of untested assertion this repository keeps a list of.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"

jobs:
  checks:
    name: Lint, typecheck, unit tests, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        # 0 errors is the bar. Warnings are tracked but do not fail the build.
        run: npm run lint

      - name: Typecheck
        # `supabase/functions` is excluded from tsconfig.json and is NOT covered
        # by this step — its `.js` specifiers resolve only through a per-function
        # import map, which tsc cannot be given. The step below covers it.
        run: npx tsc --noEmit

      - name: Typecheck the Edge Functions
        # Each function checked with its OWN deno.json import map, which is the
        # only way this directory typechecks at all. Its first run found eight
        # throws of a rejection code that does not exist — live behaviour was
        # HTTP 200 with the literal message "undefined" — plus a ledger reason
        # its own callers pass and a seat persisted without a required field.
        # Running the stack proves the paths that are exercised; this proves the
        # ones that are not.
        run: npm run check:functions

      - name: Unit and integration tests (no server stack)
        # tests/server/** is excluded here on purpose — see the header. It runs
        # in the `database` job, where a stack exists and a skip is a failure.
        # The npm script IS this command; calling it rather than repeating it
        # keeps the workflow and a local run from drifting apart.
        run: npm run test:unit

      - name: Per-area coverage gates
        # NEVER RUN BY CI UNTIL THIS STEP EXISTED, and it had been FAILING.
        # `decision-grading.ts` sat at 47.76% statements against an 85% bar from
        # the moment the assistance selector shipped — `adviceFor`, the function
        # that decides what a Learn table TELLS a player before they choose, had
        # no unit test at all. A gate nobody runs is not a gate.
        #
        # It is the unit half only: `tests/server/**` is excluded from the
        # COVERAGE run because those tests drive the real functions over HTTP
        # and score zero under unit instrumentation, which would average real
        # logic against untestable plumbing.
        run: npm run test:coverage

      - name: Expo config doctor
        run: npx expo-doctor@latest

      - name: Build validation — the app must bundle
        # Not a store build: this proves every import resolves and the bundler
        # produces a Hermes bytecode bundle. A native build needs EAS and
        # credentials, which are the deployment boundary.
        #
        # --clear is not cosmetic. Without it this step failed locally with
        # "Failed to get the SHA-1 for … react-native-worklets/.worklets/…":
        # the worklets plugin writes generated files under node_modules, and a
        # Metro cache that outlives a dependency change points at files that no
        # longer exist. A fresh runner would not usually have that cache, but
        # the command below is the one that was actually run and proved.
        run: npx expo export --platform ios --output-dir /tmp/arc21-export --clear

  database:
    name: pgTAP and server integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start the stack
        run: supabase start

      - name: Apply every migration from scratch
        run: supabase db reset

      - name: pgTAP
        run: supabase test db

      - name: Serve the Edge Functions
        # --no-verify-jwt tells the GATEWAY not to pre-check the token. The
        # function still authenticates every request itself, which is what the
        # 401 below proves.
        run: supabase functions serve --no-verify-jwt &

      - name: Wait for the functions to serve
        # Only a 401 proves the FUNCTION is up. With the Edge runtime stopped
        # the API gateway still answers — 503 — and an "any response" check
        # once reported the stack as up while nine tests failed instead of
        # skipping.
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              http://127.0.0.1:54321/functions/v1/game-command \
              -H "content-type: application/json" -d '{}' || true)
            if [ "$code" = "401" ]; then
              echo "functions serving (401 after ${attempt}s)"
              exit 0
            fi
            sleep 1
          done
          echo "the Edge Functions never answered 401; last code was '${code}'" >&2
          exit 1

      - name: Server integration tests
        # `npm run test:server` carries BOTH halves of what this step needs, and
        # carrying them in the script rather than here is deliberate:
        #
        #   ARC21_REQUIRE_SERVER_STACK=1 — without it these SKIP when the stack
        #   is down and the job passes having tested nothing;
        #
        #   --maxWorkers=2 — these ten files drive ONE Edge-runtime container
        #   over HTTP, and at full file parallelism the two tests that hold a
        #   real race or a real clock open time out on a busy machine. A gate
        #   must not depend on how idle the runner is.
        run: npm run test:server
