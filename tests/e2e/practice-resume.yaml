# Arc 21 — Practice survives being killed mid-hand.
#
# WHY THIS FLOW FAILED FOR THREE SESSIONS, AND WHAT IT ACTUALLY FOUND.
#
# Two earlier sessions recorded this as a HARNESS problem: "Maestro's stopApp is
# a hard kill with no background transition, and its launchApp races the dev
# build's Metro reload, so the assertion lands before hydration completes.
# Re-check this against a release build, where the bundle is embedded and the
# reload window disappears."
#
# Phase 14 session 6 re-checked it against a release build. It failed in exactly
# the same place — and the failure screenshot showed the app displaying
# "Resume your session · Bankroll 4,900 · hand 1", correct in every detail.
#
# The persistence had never been broken. The ACCESSIBILITY TREE was.
# `app/(tabs)/home.tsx` gave its Practice card `accessibilityLabel="Play
# Practice"`, and on iOS a label on a pressable REPLACES the text of everything
# inside it. So the tree contained "Play Practice" and no bankroll at all, and
# `.*4,900.*` could never match however long it waited. The hierarchy dump beside
# that failure lists every string on screen: "Resume your session", "Bankroll
# 4,900", "Continue" and "First Deal" are all absent from it.
#
# That is a real defect and not a test problem: a player using VoiceOver was told
# "Play Practice" whether or not they had a session in progress, and was never
# told the bankroll or the hand number. The label now carries the card's content,
# and this flow passes.
#
# The lesson is the one already in CLAUDE.md, arriving from the other direction:
# a label REPLACES child text. Two sessions read "assertion not visible" as
# "state not restored" when the screenshot said otherwise. Read the screenshot
# and the hierarchy dump before believing the assertion.
#
# This flow stays OUT of the three-flow standard gate (every-screen /
# practice-hand / career-node); nowhere in this repo globs tests/e2e/*.yaml, so
# it is excluded by omission, not by a suppressed failure. It is also the flow
# that catches a whole class of regression the unit tests cannot see — a storage
# layer that fails to initialise on device, or hydration that hangs and leaves
# the table blank forever. Both have happened here.
#
# Run with:
#   export JAVA_HOME=/opt/homebrew/opt/openjdk
#   maestro test tests/e2e/practice-resume.yaml
#
# Begin with a fresh Practice session at BETTING_OPEN. For a fresh installation
# use scripts/e2e-fresh-app.ts: Maestro clearState does not erase iOS SQLite.

appId: com.arc21.app
---
- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn:
          text: "Cancel"
          # The dialog can dismiss itself between the `when` and the tap.
          optional: true

# Onboarding gates a fresh install. Skipping to the app as a guest is one tap,
# and this stays conditional so the flow also works on a device that has already
# been onboarded.
# Wait for onboarding to actually render before deciding whether to skip it —
# checking immediately after launch tests only whether the bundle has loaded yet.
# Optional, so the flow also works on a device that is already onboarded.
- extendedWaitUntil:
    visible:
      id: "onboarding-guest"
    timeout: 30000
    optional: true
# Tapped inside a `repeat`, not once.
#
# A tap issued while the screen is still settling can be swallowed, and the
# single-tap version then sat on onboarding until the 30-second wait below gave
# up — a failure that looked like a broken app and was a lost tap. Once the tap
# lands, onboarding is gone and the remaining passes find nothing to do.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              id: "onboarding-guest"
          commands:
            # `optional`, because the branch above and this tap are two
            # separate reads of the screen: the tap that LANDS navigates
            # away, and a `when` evaluated against a hierarchy captured
            # mid-transition then sends the next iteration at a control
            # that has gone. Measured on a Release build at load 5.6 —
            # `Element not found: home-practice` with the failure
            # screenshot showing the Practice table, already open. The
            # assertion that follows this block is what proves the tap
            # landed; the tap itself never was the evidence.
            - tapOn:
                optional: true
                id: "onboarding-guest"

- extendedWaitUntil:
    visible:
      id: "home-practice"
    timeout: 30000
# THE TAP THAT OPENS PRACTICE, INSIDE A `repeat`.
#
# It failed once in phase 11 at load average 9.2: `Tap on id: home-practice...
# COMPLETED`, and the next assertion's screenshot showed Home with the card
# still on it. That is CLAUDE.md's "a step that COMPLETED did not necessarily do
# anything" — a tap issued while the screen was still settling after onboarding,
# swallowed with no error. The same commit passed on the re-run at load 7.6.
#
# `repeat` is the fix CLAUDE.md already prescribes for the onboarding tap above,
# and it is self-limiting here for the same reason: once the tap lands, the app
# is on Practice and `home-practice` is no longer visible, so the remaining
# iterations skip.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              id: "home-practice"
          commands:
            # `optional`, because the branch above and this tap are two
            # separate reads of the screen: the tap that LANDS navigates
            # away, and a `when` evaluated against a hierarchy captured
            # mid-transition then sends the next iteration at a control
            # that has gone. Measured on a Release build at load 5.6 —
            # `Element not found: home-practice` with the failure
            # screenshot showing the Practice table, already open. The
            # assertion that follows this block is what proves the tap
            # landed; the tap itself never was the evidence.
            - tapOn:
                optional: true
                id: "home-practice"

- extendedWaitUntil:
    visible: "Place a bet to be dealt in."
    timeout: 15000

# Reach a LIVE hand. A natural or dealer peek can settle a fair deal at once,
# so advance those hands instead of assuming that hand one is resumable mid-turn.
- repeat:
    times: 8
    while:
      notVisible:
        id: action-stand
    commands:
      - runFlow:
          when:
            visible:
              id: next-hand
          commands:
            - tapOn:
                id: next-hand
      - runFlow:
          when:
            visible:
              id: bet-deal
          commands:
            - repeat:
                times: 3
                while:
                  visible:
                    id: bet-staged
                    text: "0"
                commands:
                  - tapOn:
                      id: chip-100
            - assertVisible:
                id: bet-staged
                text: "100"
            - tapOn:
                id: bet-deal
      - runFlow:
          when:
            visible:
              id: insurance-decline
          commands:
            - tapOn:
                id: insurance-decline

- assertVisible:
    id: action-stand
- assertVisible: ".*Bet 100.*"
- copyTextFrom:
    id: player-hand-value
- evalScript: ${output.playerTotal = maestro.copiedText}
- copyTextFrom:
    id: dealer-hand-value
- evalScript: ${output.dealerTotal = maestro.copiedText}
- takeScreenshot: practice-before-kill
- waitForAnimationToEnd:
    timeout: 3000
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: ".*Resume your session.*"
    timeout: 30000
- openLink: arc21://game/practice
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: action-stand
    timeout: 20000
- assertVisible: ".*Bet 100.*"
- assertVisible:
    id: player-hand-value
    text: ${output.playerTotal}
- assertVisible:
    id: dealer-hand-value
    text: ${output.dealerTotal}
- assertNotVisible:
    id: next-hand
- assertNotVisible:
    id: open-review
- takeScreenshot: practice-after-kill
