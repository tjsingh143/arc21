# Arc 21 — Practice survives being killed mid-hand.
#
# WHY THIS FLOW FAILED FOR THREE SESSIONS, AND WHAT IT ACTUALLY FOUND.
#
# Two earlier sessions recorded this as a HARNESS problem: "Maestro's stopApp is
# a hard kill with no background transition, and its launchApp races the dev
# build's Metro reload, so the assertion lands before hydration completes.
# Re-check this against a release build, where the bundle is embedded and the
# reload window disappears."
#
# Phase 14 session 6 re-checked it against a release build. It failed in exactly
# the same place — and the failure screenshot showed the app displaying
# "Resume your session · Bankroll 4,900 · hand 1", correct in every detail.
#
# The persistence had never been broken. The ACCESSIBILITY TREE was.
# `app/(tabs)/home.tsx` gave its Practice card `accessibilityLabel="Play
# Practice"`, and on iOS a label on a pressable REPLACES the text of everything
# inside it. So the tree contained "Play Practice" and no bankroll at all, and
# `.*4,900.*` could never match however long it waited. The hierarchy dump beside
# that failure lists every string on screen: "Resume your session", "Bankroll
# 4,900", "Continue" and "First Deal" are all absent from it.
#
# That is a real defect and not a test problem: a player using VoiceOver was told
# "Play Practice" whether or not they had a session in progress, and was never
# told the bankroll or the hand number. The label now carries the card's content,
# and this flow passes.
#
# The lesson is the one already in CLAUDE.md, arriving from the other direction:
# a label REPLACES child text. Two sessions read "assertion not visible" as
# "state not restored" when the screenshot said otherwise. Read the screenshot
# and the hierarchy dump before believing the assertion.
#
# This flow stays OUT of the three-flow standard gate (every-screen /
# practice-hand / career-node); nowhere in this repo globs tests/e2e/*.yaml, so
# it is excluded by omission, not by a suppressed failure. It is also the flow
# that catches a whole class of regression the unit tests cannot see — a storage
# layer that fails to initialise on device, or hydration that hangs and leaves
# the table blank forever. Both have happened here.
#
# Run with:
#   export JAVA_HOME=/opt/homebrew/opt/openjdk
#   maestro test tests/e2e/practice-resume.yaml

appId: com.arc21.app
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn:
          text: "Cancel"
          # The dialog can dismiss itself between the `when` and the tap.
          optional: true

# Onboarding gates a fresh install. Skipping to the app as a guest is one tap,
# and this stays conditional so the flow also works on a device that has already
# been onboarded.
# Wait for onboarding to actually render before deciding whether to skip it —
# checking immediately after launch tests only whether the bundle has loaded yet.
# Optional, so the flow also works on a device that is already onboarded.
- extendedWaitUntil:
    visible:
      id: "onboarding-guest"
    timeout: 30000
    optional: true
# Tapped inside a `repeat`, not once.
#
# A tap issued while the screen is still settling can be swallowed, and the
# single-tap version then sat on onboarding until the 30-second wait below gave
# up — a failure that looked like a broken app and was a lost tap. Once the tap
# lands, onboarding is gone and the remaining passes find nothing to do.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              id: "onboarding-guest"
          commands:
            # `optional`, because the branch above and this tap are two
            # separate reads of the screen: the tap that LANDS navigates
            # away, and a `when` evaluated against a hierarchy captured
            # mid-transition then sends the next iteration at a control
            # that has gone. Measured on a Release build at load 5.6 —
            # `Element not found: home-practice` with the failure
            # screenshot showing the Practice table, already open. The
            # assertion that follows this block is what proves the tap
            # landed; the tap itself never was the evidence.
            - tapOn:
                optional: true
                id: "onboarding-guest"

- extendedWaitUntil:
    visible:
      id: "home-practice"
    timeout: 30000
# THE TAP THAT OPENS PRACTICE, INSIDE A `repeat`.
#
# It failed once in phase 11 at load average 9.2: `Tap on id: home-practice...
# COMPLETED`, and the next assertion's screenshot showed Home with the card
# still on it. That is CLAUDE.md's "a step that COMPLETED did not necessarily do
# anything" — a tap issued while the screen was still settling after onboarding,
# swallowed with no error. The same commit passed on the re-run at load 7.6.
#
# `repeat` is the fix CLAUDE.md already prescribes for the onboarding tap above,
# and it is self-limiting here for the same reason: once the tap lands, the app
# is on Practice and `home-practice` is no longer visible, so the remaining
# iterations skip.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              id: "home-practice"
          commands:
            # `optional`, because the branch above and this tap are two
            # separate reads of the screen: the tap that LANDS navigates
            # away, and a `when` evaluated against a hierarchy captured
            # mid-transition then sends the next iteration at a control
            # that has gone. Measured on a Release build at load 5.6 —
            # `Element not found: home-practice` with the failure
            # screenshot showing the Practice table, already open. The
            # assertion that follows this block is what proves the tap
            # landed; the tap itself never was the evidence.
            - tapOn:
                optional: true
                id: "home-practice"

- extendedWaitUntil:
    visible: "Place a bet to be dealt in."
    timeout: 15000

# Commit chips and deal, so there is a hand in progress worth losing.
- tapOn:
    id: "chip-100"
- tapOn:
    id: "bet-deal"

- runFlow:
    when:
      visible: "Dealer is showing an Ace."
    commands:
      - tapOn:
          id: "insurance-decline"

# The hand is now live: cards are dealt and the wager is committed.
- assertVisible: ".*Bet 100.*"

# --- Record what is actually on the felt -----------------------------------
#
# Bankroll and wager surviving a kill proves the SAVE happened. It does not
# prove the same hand came back: a fresh shoe dealt behind a restored bankroll
# would satisfy both. So the player's and the dealer's totals are copied into
# `${maestro.copiedText}` here and compared after the relaunch.
#
# The totals are the strongest thing the tree can be asked for. They are derived
# from the actual cards by `evaluateHand`, so a different hand of the same total
# is the only way to fool this — one chance in a handful per run, and it would
# have to happen with the wager and the bankroll also intact. A phantom card or
# a duplicated deal moves the total and fails here.
- copyTextFrom:
    id: "player-hand-value"
- evalScript: ${output.playerTotal = maestro.copiedText}

- copyTextFrom:
    id: "dealer-hand-value"
- evalScript: ${output.dealerTotal = maestro.copiedText}

# --- Kill and reopen -------------------------------------------------------
# A real player does not kill the app in the same millisecond as their last tap.
# The pause keeps this flow testing persistence rather than racing the write —
# the write itself is forced by the background flush in usePersistOnBackground.
- waitForAnimationToEnd:
    timeout: 3000

# clearState: false is the whole point — this is a relaunch, not a fresh install.
- stopApp
- launchApp:
    clearState: false

# Hydration is asynchronous — SQLite has to open and the record has to parse —
# so this waits for the restored bankroll rather than asserting immediately.
# 4,900 is the proof: a fresh session would read 5,000.
- extendedWaitUntil:
    visible: ".*4,900.*"
    timeout: 30000

# Home must know a session is in progress. If it says "Play offline" instead,
# the hand is intact on disk but invisible to the player — which is exactly the
# bug this flow caught.
# A REGEX, because Maestro matches text exactly and the card's accessibility
# label now reads "Resume your session. Bankroll 4,900, hand 1." — the fuller
# label is the fix above, and an exact match would fail on the very string that
# proves it works.
- assertVisible: ".*Resume your session.*"

# --- Back into the table, by deep link -------------------------------------
#
# NOT `tapOn: home-practice`, and the reason is worth writing down because the
# symptom is a convincing impostor.
#
# After `stopApp` + `launchApp` inside one Maestro session, the tap on this card
# reports COMPLETED and the app stays on Home. The failure screenshot shows a
# perfect Home screen — "Resume your session · Bankroll 4,900 · hand 1" — while
# the hierarchy dump beside it contains EIGHT nodes: the three with an
# accessibility identifier, two battery readings and the status bar. Every piece
# of text on the screen is missing from the tree, and the device log for the
# same second carries `XCTAS Error: Error getting main window Unknown kAXError
# value -25218`. The driver is tapping at coordinates from a snapshot it could
# not actually read.
#
# It was not the app. Deep-linking to `arc21://game/practice` from a shell — no
# Maestro involved — brought back the exact hand every time: dealer 8, player
# 6♥ A♣ "Soft 17 · Bet 100", Hand 1 · Shoe 1. The assertion below is that same
# check, made by the flow.
#
# So this uses the mechanism CLAUDE.md already names as the reliable one. The
# Home card is still ASSERTED above — that assertion is what caught a real
# VoiceOver defect once — it is simply no longer the thing navigation depends on.
- openLink: arc21://game/practice

# iOS asks for confirmation when the app is already in the foreground.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn:
          text: "Open"
          # The dialog can dismiss itself between the `when` and the tap.
          optional: true

# The committed wager and the dealt hand are still there — not a fresh shoe
# wearing the same bankroll.
- extendedWaitUntil:
    visible: ".*Bet 100.*"
    timeout: 20000
- assertNotVisible: "Place a bet to be dealt in."

# --- The same hand, not merely a hand --------------------------------------
# Same cards for the player, same upcard for the dealer, same phase, same
# active hand. A restored bankroll wearing a freshly dealt hand fails here.
- assertVisible:
    id: "player-hand-value"
    text: ${output.playerTotal}
- assertVisible:
    id: "dealer-hand-value"
    text: ${output.dealerTotal}

# No duplicate settlement: the hand is still IN PROGRESS, so nothing was
# settled by the relaunch. An outcome badge or the next-hand control appearing
# here would mean the restored state resolved a hand that was never finished.
- assertNotVisible:
    id: "next-hand"

# The shoe carried on rather than starting over: the review surface opens only
# when there is a settled hand or a bet to place, and neither is true mid-hand.
- assertNotVisible:
    id: "open-review"
