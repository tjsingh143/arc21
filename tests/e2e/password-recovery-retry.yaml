# Start on the real recovery screen after requesting the email on THIS device
# and following its GoTrue verify link. OLD_PASSWORD must be the disposable
# account's actual current password, so the first refusal occurs on the server
# after PKCE exchange. Do not relaunch or open another recovery link in this flow.
# Pair the native result with GoTrue logs: one PKCE exchange, refused PUT /user,
# successful PUT /user, then successful new-password and refused old-password login.
appId: com.arc21.app
---
- launchApp:
    stopApp: false
    clearState: false
- assertVisible: Reset your password
- tapOn:
    id: recovery-password
- eraseText
- inputText: ${OLD_PASSWORD}
- tapOn:
    id: recovery-confirm
- eraseText
- inputText: ${OLD_PASSWORD}
- tapOn:
    id: recovery-submit
- extendedWaitUntil:
    visible: Choose a different password from your current one.
    timeout: 15000
- takeScreenshot: server-refused-original-password
- tapOn:
    id: recovery-password
- eraseText
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: recovery-confirm
- eraseText
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: recovery-submit
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible:
      id: home-practice
    timeout: 15000
- assertVisible:
    id: header-chips
- takeScreenshot: corrected-password-recovered
- openLink: arc21://settings
- scrollUntilVisible:
    element:
      text: Sign out
    direction: DOWN
    timeout: 40000
- assertVisible: ${EMAIL}
- tapOn: Sign out
- assertVisible: Sign out?
- tapOn:
    text: Sign out
    index: 1
- extendedWaitUntil:
    visible: Recover an existing player
    timeout: 15000
- tapOn: Recover an existing player
- tapOn:
    id: auth-email
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: auth-password
- eraseText
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: auth-submit
# iOS may cover the successful Home return with its Save Password alert.
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible:
      id: home-practice
    timeout: 15000
- assertVisible:
    id: header-chips
- takeScreenshot: new-password-native-signin
- openLink: arc21://settings
- scrollUntilVisible:
    element:
      text: Sign out
    direction: DOWN
    timeout: 40000
- assertVisible: ${EMAIL}
- tapOn: Sign out
- assertVisible: Sign out?
- tapOn:
    text: Sign out
    index: 1
- extendedWaitUntil:
    visible: Recover an existing player
    timeout: 15000
- tapOn: Recover an existing player
- tapOn:
    id: auth-email
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: auth-password
- eraseText
- inputText: ${OLD_PASSWORD}
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible: That email and password do not match an account.
    timeout: 15000
- assertNotVisible:
    id: header-chips
- assertVisible: ${EMAIL}
- takeScreenshot: original-password-native-rejected
