# Signed-in fixture with only the initial 25,000-chip grant and no Career runs.
# Keep the map mounted so its header must observe settlement from the table.
appId: com.arc21.app
---
- openLink: arc21://career
- extendedWaitUntil:
    visible:
      id: header-chips
      text: "25,000"
    timeout: 30000
- tapOn: "First Deal, 0 of 3 stars"
- scrollUntilVisible:
    element:
      id: career-start-ranked
    direction: DOWN
    timeout: 20000
- tapOn:
    id: career-start-ranked
- runFlow: complete-ranked-session.yaml
- scrollUntilVisible:
    element:
      id: career-server-record
    direction: DOWN
    timeout: 30000
- assertVisible: "Server record: [1-3] of 3 stars across 1 attempt."
- scrollUntilVisible:
    element: "Back to Career"
    direction: DOWN
    timeout: 20000
- tapOn: "Back to Career"
- extendedWaitUntil:
    visible:
      id: header-chips
      text: "25,200"
    timeout: 30000
- assertVisible: ".*1 of 18 nodes completed on the server.*"
- takeScreenshot: career-reward-wallet-return
