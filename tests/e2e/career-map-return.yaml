# The ordinary Play route must offer a visible, accessible return from Career.
appId: com.arc21.app
---
- launchApp:
    stopApp: false
    clearState: false
- openLink: arc21://home
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
- tapOn: Play
# By the card's testID. Its label now also carries the Offline badge and a
# facts line (Refresh D), and the node count is derived from the catalogue, so
# a regex over the label's wording would track copy rather than the card.
- scrollUntilVisible:
    element:
      id: play-mode-career
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: play-mode-career
- extendedWaitUntil:
    visible: First Deal, .* stars.*
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: career-map-return
- assertVisible:
    id: back-bar
- tapOn:
    id: back-bar
# Play by its own id, not its header subtitle: since Refresh D the Career card
# sits at the BOTTOM of Play, and Back restores the scroll position it was
# opened from, so the header is off-screen and the card is what is showing.
- extendedWaitUntil:
    visible:
      id: play-screen
    timeout: 15000
- assertVisible:
    id: play-mode-career
- tapOn: Home
- assertVisible:
    id: home-screen
- stopApp
- openLink: arc21://career
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: back-bar
    timeout: 30000
- tapOn:
    id: back-bar
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: career-cold-return-home
