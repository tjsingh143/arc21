# Arc 21 — sign in, as a subflow.
#
# The three states a server-configured flow can start in are the same every
# time and getting them wrong costs a run, so they are answered in one place:
# already signed in, sitting on onboarding, or sitting on the auth screen.
# `clearState: true` does not clear the iOS keychain, so a relaunch can restore
# the session and land on Home without ever showing an auth field.
#
# TYPED, NOT PASTED. This subflow used to long-press each field and tap the
# "Paste" callout. The reason it did is real but does not apply here:
# `inputText` drops characters on this simulator, and the CREATE-ACCOUNT
# screen's `textContentType="newPassword"` raises the strong-password overlay
# and swallows typing entirely. This is the SIGN-IN screen, whose plain
# `textContentType="password"` types fine.
#
# And the paste path is not merely unnecessary, it is unreliable.
# `mc-sign-in.yaml` was rewritten off it for exactly this, and its comment
# records "three taps on Paste reported COMPLETED and left both fields empty".
# That rewrite never reached this file, and four flows kept using it — so the
# same failure was still waiting. `every-screen-online.yaml` found it on a
# Release build: both `Tap on "Paste"` steps COMPLETED, the failure screenshot
# shows an untouched `you@example.com` placeholder, and the `assertVisible`
# guarding the paste had nothing to see. Sixth instance of "a step that
# COMPLETED did not necessarily do anything".
#
# Erased before typing, so a retry after a dropped character retypes the field
# rather than appending to it — which is what makes the loop a real retry
# rather than a second way to fail.

appId: com.arc21.app
---
- repeat:
    times: 8
    while:
      notVisible:
        id: "header-chips"
    commands:
      # A leftover deep-link confirmation, and iOS's offer to save the
      # password. Both sit OVER the app, and while either is up every assertion
      # underneath it fails — which reads as a screen that did not render.
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Cancel"
      - runFlow:
          when:
            visible: "Save Password?"
          commands:
            - tapOn: "Not Now"

      - runFlow:
          when:
            visible:
              id: "onboarding-sign-in"
          commands:
            - tapOn:
                id: "onboarding-sign-in"

      - runFlow:
          when:
            visible:
              id: "auth-email"
          commands:
            - tapOn:
                id: "auth-email"
            - eraseText
            - inputText: "e2e-lobby@arc21.test"
            - tapOn:
                id: "auth-password"
            - eraseText
            - inputText: "e2e-lobby@arc21.test"
            - tapOn:
                id: "auth-submit"

# THE PROOF, and it is `header-chips` rather than `home-practice`. Home is
# shown to a GUEST too; a balance in the header is not, because a guest gets
# the word GUEST and no number. The loop used to exit on `home-practice`, so a
# sign-in that quietly failed and left the app a guest would have satisfied it
# and the flow would have gone on to fail somewhere with no auth in it at all.
# `mc-sign-in.yaml` already drew this distinction; this file had not.
- extendedWaitUntil:
    visible:
      id: "header-chips"
    timeout: 60000
- assertVisible:
    id: "home-practice"
