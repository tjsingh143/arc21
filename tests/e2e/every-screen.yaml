# Arc 21 — visit every screen and assert real content on each.
#
# This is the audit flow. Typechecking proves a screen COMPILES; it proves
# nothing about whether it renders, whether its data source is wired, or whether
# it is reachable at all. Several screens in this app were written, typechecked,
# and never once opened.
#
# Each stop asserts a string that only appears if that screen genuinely rendered
# its own content — not a title that a loading state would also show.
#
# THIS FLOW NEEDS A GENUINELY FRESH INSTALL, and `clearState: true` does not
# give it one. Measured: `launchApp: clearState: true` on iOS leaves the app's
# **Documents** directory in place, so `Documents/SQLite/arc21.db` — onboarding
# completion, the Practice session, career progress — survives it, and so does
# the KEYCHAIN, where the Supabase session lives. This file's very first
# assertion is that ONBOARDING is on screen, so it has never actually started
# from a fresh install: it passed because the simulator happened to be in the
# right state, and it failed the moment two flows that sign in had run on the
# same device. `scripts/e2e-fresh-app.ts` removes both.
#
# It also needs `.env.local` MOVED ASIDE: it asserts `.*no server configured.*`
# in six places, and that copy appears only while `EXPO_PUBLIC_SUPABASE_URL` is
# unset. Metro inlines `EXPO_PUBLIC_*` at bundle time, so the dev server has to
# be restarted after moving it — the file being absent is not enough on its own.
# `every-screen-online.yaml` is the same audit from the other side, on a build
# that HAS a server.
#
# Run with:
#   mv .env.local /tmp/            # then restart Metro
#   npx tsx scripts/e2e-fresh-app.ts
#   export JAVA_HOME=/opt/homebrew/opt/openjdk
#   maestro test tests/e2e/every-screen.yaml

appId: com.arc21.app
---
- launchApp:
    clearState: true


# --- Onboarding ------------------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "onboarding-guest"
    timeout: 40000
- assertVisible: ".*no monetary value.*"
# Account routes are real now. Onboarding used to answer both with a note saying
# Arc 21 had no account service — true when written, false three phases later,
# and nobody came back to it.
- assertVisible: "Create Account"
- assertVisible: "Sign In"
# Tapped inside a `repeat`: a tap issued while the screen is still settling can
# be swallowed, and the single-tap version then sat here until the wait below
# gave up.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              id: "onboarding-guest"
          commands:
            - tapOn:
                id: "onboarding-guest"

- extendedWaitUntil:
    visible:
      id: "home-practice"
    timeout: 40000

# --- Home ------------------------------------------------------------------
- assertVisible: ".*Blackjack, without the noise.*"

# --- Play tab --------------------------------------------------------------
# A tab tap can be SWALLOWED while the previous screen is still settling, and
# `extendedWaitUntil` cannot recover one: it waits for a destination the finger
# never asked for. This flow failed here with "Sprint Tournament is not visible"
# while the failure screenshot showed the app still sitting on Home with the
# Home tab highlighted — the tap COMPLETED and did nothing. Retrying the tap
# until the destination appears is the same remedy the onboarding tap already
# uses above. The assertion below is unchanged; only the tap is now durable.
- repeat:
    while:
      notVisible: ".*Sprint Tournament.*"
    times: 4
    commands:
      - tapOn: "Play"
- extendedWaitUntil:
    visible: ".*Sprint Tournament.*"
    timeout: 15000
# Server-dependent modes must read as unavailable, not as broken buttons.
- assertVisible: ".*Needs an account.*"

# --- Sprint Tournament -----------------------------------------------------
# `scrollUntilVisible`, not `tapOn`. These are the last two cards on the Play
# tab and sit below the fold: a bare `tapOn` found "Daily Challenge" in the
# accessibility tree, tapped where it was NOT on screen, and the flow carried on
# against an unchanged Play tab. A title present in the tree is not a title the
# finger can reach.
- scrollUntilVisible:
    # REGEX, not the bare title. Each mode card is now ONE accessibility
    # element whose label carries the title, the purpose, the structure and the
    # note about needing an account — because a labelled Pressable replaces its
    # children on iOS, and until this phase a screen reader heard only the
    # title. Exact-text selectors on these cards stopped matching the moment
    # that was fixed, and correctly so: there is no bare "Sprint Tournament"
    # node any more.
    element: ".*Sprint Tournament.*"
    direction: DOWN
    timeout: 15000
- tapOn: ".*Sprint Tournament.*"
- extendedWaitUntil:
    visible: ".*Four players, equal stacks, one elimination.*"
    timeout: 20000
# This build has no server configured, so the screen must SAY that rather than
# render a format it could not read or an entry button that cannot work.
#
# The format itself comes from `sprint_format()`, which is granted to `anon` so a
# signed-out player on a configured build sees the real structure before deciding
# to make an account — the specification's "user must know the format before
# spending". That path needs a server, so it is not what this flow can assert;
# what it asserts is that the absence is stated honestly.
- assertVisible: ".*no server configured.*"
- tapOn:
    id: "back-bar"
# Asserted against something ONLY the Play tab renders. ".*Sprint Tournament.*"
# would match the card here AND the heading on the screen we just left, so a
# failed back-navigation would still pass — the mistake this flow already made
# once with private tables.
#
# SCROLLED UP TO, not merely asserted. Returning from a pushed screen SOMETIMES
# resets the tab's scroll and sometimes restores it; CLAUDE.md records both, and
# this file used to assume the first. It held for a while and then a run came
# back at the position it left, and the header — which is real, correct and
# above the fold — read as a missing screen. Scrolling to the anchor is true in
# either case.
- scrollUntilVisible:
    element: ".*Same rules everywhere.*"
    direction: UP
    timeout: 15000

# --- Daily Challenge -------------------------------------------------------
- scrollUntilVisible:
    element: ".*Daily Challenge.*"
    direction: DOWN
    timeout: 15000
- tapOn: ".*Daily Challenge.*"
- extendedWaitUntil:
    visible: ".*Everyone plays the same shoe.*"
    timeout: 20000
# Same honesty requirement. A daily attempt cannot exist without a server, and
# the screen says so instead of showing a commitment hash it invented.
- assertVisible: ".*no server configured.*"
- tapOn:
    id: "back-bar"
# The footer, and scrolled DOWN to it for the same reason the header above is
# scrolled UP to: whether a return preserves the scroll position is not
# something this flow may assume in either direction. Both anchors are text only
# the Play tab renders.
- scrollUntilVisible:
    element: ".*same fixed rules in every mode.*"
    direction: DOWN
    timeout: 15000

# --- Social tab ------------------------------------------------------------
- repeat:
    while:
      notVisible: ".*Private table.*"
    times: 4
    commands:
      - tapOn: "Social"
- extendedWaitUntil:
    visible: ".*Private table.*"
    timeout: 15000
# Private tables are reachable now, so the flow opens the lobby and asserts the
# economics are stated on screen — a player must not assume their balance is at
# stake.
- tapOn:
    id: "social-private-table"
- extendedWaitUntil:
    visible: ".*5,000 table chips.*"
    timeout: 15000
- assertVisible: ".*Join with a code.*"
- tapOn:
    id: "back-bar"
# Asserting ".*Private table.*" here proved nothing: it matches BOTH Social's
# section heading and the lobby's own page title, so a back button that failed
# to navigate still passed — and the next step then tapped for a tab bar the
# lobby does not have. Assert something only Social renders.
- extendedWaitUntil:
    visible: ".*Friends need a server.*"
    timeout: 15000

# --- Leaderboards ----------------------------------------------------------
# Reached from Social. Signed out and with no server configured, the screen must
# state that plainly — it must never render a board of zeros, which would read as
# real standings.
- repeat:
    while:
      notVisible: ".*Friends need a server.*"
    times: 4
    commands:
      - tapOn: "Social"
- extendedWaitUntil:
    visible: ".*Friends need a server.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "social-leaderboards"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "social-leaderboards"
- extendedWaitUntil:
    visible: ".*Every figure here is recorded by the server.*"
    timeout: 20000
# The four boards the specification names, and global bankroll is not one.
- assertVisible: ".*Weekly XP.*"
- assertVisible: ".*Strategy Accuracy.*"
- assertVisible: ".*no server configured.*"
- tapOn:
    id: "back-bar"
# The footer, not the header — and SCROLLED TO rather than waited for.
#
# This line used to be an `extendedWaitUntil` under a comment asserting that
# "returning keeps that position", and it failed twice in a row in phase 9 on a
# Social tab that had come back at the TOP: the footer was in the tree and not on
# screen. CLAUDE.md already records the rule this broke — "returning from a
# pushed screen sometimes restores the previous scroll position and sometimes
# returns to the top, so assert on text that is actually on screen at that
# point". A scroll copes with either answer; a wait only copes with one, and
# passes for a year before it does not.
- scrollUntilVisible:
    element: ".*never move chips between accounts.*"
    direction: DOWN
    timeout: 20000

# --- Notifications ---------------------------------------------------------
# Reached from Social, and entered from where the Leaderboards block left off:
# returning from a pushed screen keeps the list at its foot, so re-asserting the
# header here would fail on a screen that is perfectly correct. Assert what is
# actually on screen at this point.
#
# The inbox is the RECORD of what the server said, not a fallback for push. Push
# can fail for reasons the app never learns — permission refused, a token
# expired, a build with no credentials — and a feature that existed only as a
# banner would silently do nothing. With no server configured the screen must say
# so rather than render an empty list, which would read as "nobody has ever
# contacted you".
- scrollUntilVisible:
    element:
      id: "social-notifications"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "social-notifications"
- extendedWaitUntil:
    visible: ".*whether or not your device was able to show it.*"
    timeout: 20000
- assertVisible: ".*no server configured.*"
- tapOn:
    id: "back-bar"
- extendedWaitUntil:
    visible: ".*never move chips between accounts.*"
    timeout: 15000

# --- Learn tab -------------------------------------------------------------
- repeat:
    while:
      notVisible: ".*Strategy Guide.*"
    times: 4
    commands:
      - tapOn: "Learn"
- extendedWaitUntil:
    visible: ".*Strategy Guide.*"
    timeout: 15000

# --- How to Play -----------------------------------------------------------
- tapOn: ".*How to Play.*"
- extendedWaitUntil:
    visible: ".*21.*"
    timeout: 15000
# Every pushed screen now carries a back control at the TOP, so leaving one no
# longer means scrolling to the foot of a long article or knowing the gesture.
- tapOn:
    id: "back-bar"
- extendedWaitUntil:
    visible: ".*Strategy Guide.*"
    timeout: 15000

# --- Strategy Guide --------------------------------------------------------
- tapOn: ".*Strategy Guide.*"
- extendedWaitUntil:
    visible: ".*dealer stands soft 17.*"
    timeout: 15000
# All three chart tabs must render.
- tapOn: ".*Soft.*"
- tapOn: ".*Pairs.*"
- tapOn: ".*Hard.*"
# Every pushed screen now carries a back control at the TOP, so leaving one no
# longer means scrolling to the foot of a long article or knowing the gesture.
- tapOn:
    id: "back-bar"
- extendedWaitUntil:
    visible: ".*Strategy Guide.*"
    timeout: 15000

# --- Decision Drills -------------------------------------------------------
# NOT conditional. This was a `runFlow: when: visible` block, and when the Learn
# tab stopped offering Drills it reported SKIPPED and the run still passed — so
# the audit flow silently stopped visiting one of the screens it exists to
# check. A screen this flow is responsible for gets an unconditional assertion.
- repeat:
    while:
      notVisible:
        id: "learn-drills"
    times: 4
    commands:
      - tapOn: "Learn"
- extendedWaitUntil:
    visible:
      id: "learn-drills"
    timeout: 15000
- tapOn:
    id: "learn-drills"
- extendedWaitUntil:
    visible: ".*Mixed.*"
    timeout: 15000
- tapOn:
    id: "back-bar"

# --- Profile (via the header avatar) ---------------------------------------
- tapOn:
    id: "open-profile"
# Scrolled UP to, for the same reason as the Play header: whether a screen opens
# at the top or restores a position is not something this flow may assume.
- scrollUntilVisible:
    element: "Practice is saved on this device.*"
    direction: UP
    timeout: 15000

# --- Inventory -------------------------------------------------------------
# Opened from the profile that is already on screen. The important assertion is
# an absence: nothing here shows a price, because nothing here can be bought.
- scrollUntilVisible:
    element:
      id: "profile-inventory"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "profile-inventory"
- extendedWaitUntil:
    visible: ".*none of it changes the game.*"
    timeout: 20000
- assertVisible: ".*no server configured.*"
- assertNotVisible: ".*Buy.*"
- tapOn:
    id: "back-bar"
- scrollUntilVisible:
    element: "Practice is saved on this device.*"
    direction: UP
    timeout: 15000

# --- Stats -----------------------------------------------------------------
- tapOn: "Statistics"
- extendedWaitUntil:
    visible: ".*Nothing recorded yet.*"
    timeout: 15000
# Every pushed screen now carries a back control at the TOP, so leaving one no
# longer means scrolling to the foot of a long article or knowing the gesture.
- tapOn:
    id: "back-bar"

# --- Settings --------------------------------------------------------------
# SCROLLED to. `tapOn` does not scroll, and the profile's four actions are two
# rows of two now rather than four across — four `flex: 1` buttons on a 393pt
# screen split their own labels mid-word ("Statist / ics") at the DEFAULT text
# size. Settings sits on the second row, which can be below the fold.
- scrollUntilVisible:
    element: "Settings"
    direction: DOWN
    timeout: 15000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: ".*Gameplay.*"
    timeout: 15000

# --- Fair Play -------------------------------------------------------------
# Lives in the About section at the foot of Settings.
# The Account section added real content above this, so Fair Play now sits
# further down a longer screen. Requiring 100% visibility of the row made the
# scroll marginal — it reached the link but not fully on screen, intermittently.
- scrollUntilVisible:
    element: ".*Fair Play.*"
    direction: DOWN
    visibilityPercentage: 60
    timeout: 40000
- tapOn: ".*Fair Play.*"
- extendedWaitUntil:
    visible: ".*soft 17.*"
    timeout: 15000
# The claims a player is entitled to, and which must stay true of the code.
- assertVisible: ".*3:2.*"
# The specification's Fair Play list names "online cards are selected on the
# server" alongside the device-randomness claim, and until phase 9 every fact on
# this page described Practice. It is here rather than in the online flow because
# it is a statement about the CODE, true whether or not a server is configured.
- scrollUntilVisible:
    element: "Online cards are chosen on the server"
    direction: DOWN
    timeout: 20000
